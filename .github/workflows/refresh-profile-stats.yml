name: Refresh ASHA profile statistics

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-profile-stats.yml'

permissions:
  contents: write

concurrency:
  group: asha-profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'gyomoo0424/gyomoo0424'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh the pastel card from public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import json
          import os
          import time
          from datetime import datetime, timedelta, timezone
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          OWNER = 'gyomoo0424'
          REPOSITORY = 'gyomoo0424/gyomoo0424'
          CARD_PATH = 'assets/github-stats.svg'

          def api(path, payload=None, authenticated=False):
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2026-03-10',
                  'User-Agent': 'ASHA-Profile-Stats',
              }
              if authenticated:
                  headers['Authorization'] = 'Bearer ' + os.environ['GH_TOKEN']
              body = None if payload is None else json.dumps(payload).encode('utf-8')
              request = Request('https://api.github.com' + path, data=body,
                                headers=headers, method='GET' if body is None else 'PUT')
              for attempt in range(3):
                  try:
                      with urlopen(request, timeout=30) as response:
                          return json.load(response)
                  except HTTPError as error:
                      if error.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise
                  except (URLError, TimeoutError):
                      if attempt == 2:
                          raise
                  time.sleep(2 ** attempt)

          def nonnegative(value):
              if type(value) is not int or value < 0:
                  raise ValueError('GitHub returned an invalid statistics count')
              return value

          def collect_stats(request):
              # Public endpoints are deliberately read without an authentication token.
              user = request('/users/' + OWNER)
              if user['login'].casefold() != OWNER.casefold():
                  raise ValueError('Unexpected GitHub profile')
              stars, page = 0, 1
              while True:
                  repos = request(f'/users/{OWNER}/repos?type=owner&per_page=100&page={page}')
                  if not isinstance(repos, list):
                      raise ValueError('Expected a public repository list')
                  for repo in repos:
                      if repo['private'] is False and repo['owner']['login'].casefold() == OWNER.casefold():
                          stars += nonnegative(repo['stargazers_count'])
                  if len(repos) < 100:
                      break
                  page += 1
              return [nonnegative(user['public_repos']), nonnegative(user['followers']),
                      nonnegative(user['following']), stars]

          def display_count(number):
              if number >= 1_000_000:
                  return f'{number / 1_000_000:.1f}M'
              if number >= 10_000:
                  return f'{number / 1_000:.1f}k'
              return f'{number:,}'

          def render_card(stats, updated):
              repos, followers, following, stars = stats
              counts = [display_count(number) for number in stats]
              description = (f'Public GitHub statistics, updated {updated}. '
                             f'{repos} public repositories, {followers} followers, '
                             f'{following} following, and {stars} stars received across public repositories. '
                             'Refreshed automatically every six hours. Private repository activity is excluded.')
              return f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" role="img" aria-labelledby="title desc">
            <title id="title">GitHub at a glance — gyomoo0424</title>
            <desc id="desc">{description}</desc>
            <rect x="1" y="1" width="638" height="276" rx="20" fill="#FFF9F5" stroke="#E6DCD7"/>
            <text x="26" y="30" fill="#625D66" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1">ASHA / PUBLIC ACTIVITY</text>
            <text x="614" y="30" text-anchor="end" fill="#79727D" font-family="Consolas,monospace" font-size="12">Updated {updated}</text>
            <path d="M320 56V253M26 162H614" stroke="#E6DCD7"/>
            <rect x="30" y="52" width="260" height="4" rx="2" fill="#F3CED9"/>
            <rect x="350" y="52" width="260" height="4" rx="2" fill="#D6EDE5"/>
            <rect x="30" y="174" width="260" height="4" rx="2" fill="#D8E8F6"/>
            <rect x="350" y="174" width="260" height="4" rx="2" fill="#E5DEF3"/>
            <g text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">
              <g fill="#393741" font-size="44" font-weight="600"><text x="160" y="110">{counts[0]}</text><text x="480" y="110">{counts[1]}</text><text x="160" y="226">{counts[2]}</text><text x="480" y="226">{counts[3]}</text></g>
              <g fill="#625D66" font-size="20"><text x="160" y="143">Public repositories</text><text x="480" y="143">Followers</text><text x="160" y="255">Following</text><text x="480" y="255">Public stars received</text></g>
            </g>
          </svg>
          '''

          def main():
              stats = collect_stats(api)
              updated = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M KST')
              card = render_card(stats, updated)
              path = f'/repos/{REPOSITORY}/contents/{CARD_PATH}'
              current = api(path + '?ref=main', authenticated=True)
              if base64.b64decode(current['content']).decode('utf-8') == card:
                  print('Statistics card is already up to date.')
                  return
              # A failed API request exits before this write, preserving the last valid card.
              api(path, payload={
                  'message': 'Refresh public GitHub statistics',
                  'content': base64.b64encode(card.encode('utf-8')).decode('ascii'),
                  'sha': current['sha'],
                  'branch': 'main',
              }, authenticated=True)
              print(f'Updated public statistics at {updated}: {stats}')

          if __name__ == '__main__':
              main()
