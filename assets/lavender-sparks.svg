<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 46" role="img" aria-labelledby="title">
  <title id="title">A gentle trail of lavender and peach starlight</title>
  <rect width="1000" height="46" rx="12" fill="#1c1728"/>
  <path d="M24 23H976" stroke="#51405f"/>
  <defs><path id="spark" d="m0-7 2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></defs>
  <g fill="#dcc5f6">
    <use href="#spark" x="55" y="23"><animate attributeName="opacity" values=".35;1;.35" dur="4s" repeatCount="indefinite"/></use>
    <use href="#spark" x="350" y="23"><animate attributeName="opacity" values=".8;.35;.8" dur="5s" repeatCount="indefinite"/></use>
    <use href="#spark" x="650" y="23"><animate attributeName="opacity" values=".35;1;.35" dur="5s" repeatCount="indefinite"/></use>
    <use href="#spark" x="945" y="23"><animate attributeName="opacity" values=".8;.35;.8" dur="4s" repeatCount="indefinite"/></use>
  </g>
  <g fill="#e8c1b1">
    <use href="#spark" x="190" y="23"><animate attributeName="opacity" values="1;.35;1" dur="4.5s" repeatCount="indefinite"/></use>
    <use href="#spark" x="500" y="23"><animate attributeName="opacity" values=".35;1;.35" dur="4.5s" repeatCount="indefinite"/></use>
    <use href="#spark" x="810" y="23"><animate attributeName="opacity" values="1;.35;1" dur="5s" repeatCount="indefinite"/></use>
  </g>
</svg>
