<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ASHA — Lavender Fox Dev</title>
  <desc id="desc">An original lavender observatory with stars, an orbit, and a small code window. Small sparks. Thoughtful tools. Playful worlds.</desc>
