    <linearGradient id="rule"><stop stop-color="#d8c3f5"/><stop offset="1" stop-color="#edc3b0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bda4df" stroke-opacity=".045"/></pattern>
